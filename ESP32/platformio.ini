[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -Iinclude

; Compile the real Modbus path. Sensor remains invalid until its driver is implemented.
[env:esp32dev_modbus]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSIMULATION_MODE=0
