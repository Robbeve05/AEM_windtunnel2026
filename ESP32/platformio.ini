[platformio]
default_envs = waveshare_s3
build_dir = C:/Projects/WindtunnelPlatformIO/dispatcher-build
[env:waveshare_s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
extra_scripts = pre:.vscode/native_build.py
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -Wall -Wextra -Iinclude
[env:waveshare_s3_sim]
extends = env:waveshare_s3
build_flags = ${env:waveshare_s3.build_flags} -DSIMULATION_MODE=1
